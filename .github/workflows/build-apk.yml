name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-tunes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Generate app icons
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0A0D12' --iconBackgroundColorDark '#0A0D12'

      - name: Copy web files into the app
        run: npx cap sync android

      - name: Build the APK
        working-directory: my-tunes/android
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk My-Tunes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: My-Tunes-APK
          path: my-tunes/My-Tunes.apk
