name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-tunes-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Generate app icons
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0A0D12' --iconBackgroundColorDark '#0A0D12'

      - name: Stamp the build number
        run: |
          sed -i "s/__BUILD__/${{ github.run_number }}/" www/index.html
          grep -n "const APP_BUILD" www/index.html
          if grep -q "parseInt('__BUILD__'" www/index.html; then echo "Build number was NOT stamped"; exit 1; fi

      - name: Copy web files into the app
        run: npx cap sync android

      - name: Use the saved signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "The secret DEBUG_KEYSTORE_B64 is missing or empty. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore

      - name: Build the APK
        working-directory: my-tunes-app/android
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk My-Tunes.apk

      - name: Show signing fingerprint
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs My-Tunes.apk | grep "SHA-256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" My-Tunes.apk --title "My Tunes v${{ github.run_number }}" --notes "Build ${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: My-Tunes-APK
          path: my-tunes-app/My-Tunes.apk
