name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-tunes-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Set the app version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Make the app icons
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import os, sys
          for f in ('icon-only.png', 'icon-foreground.png'):
              if not os.path.exists('assets/' + f):
                  sys.exit('Missing assets/' + f + ' - upload the icon PNGs into my-tunes-app/assets')
          res = 'android/app/src/main/res'
          sizes = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          only = Image.open('assets/icon-only.png').convert('RGBA')
          fg = Image.open('assets/icon-foreground.png').convert('RGBA')
          for name, (legacy, adaptive) in sizes.items():
              folder = res + '/mipmap-' + name
              os.makedirs(folder, exist_ok=True)
              small = only.resize((legacy, legacy), Image.LANCZOS)
              small.save(folder + '/ic_launcher.png')
              small.save(folder + '/ic_launcher_round.png')
              fg.resize((adaptive, adaptive), Image.LANCZOS).save(folder + '/tunes_fg.png')
          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)
          os.makedirs(res + '/values', exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/tunes_icon_bg"/>\n    <foreground android:drawable="@mipmap/tunes_fg"/>\n</adaptive-icon>\n'
          for n in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              open(res + '/mipmap-anydpi-v26/' + n, 'w').write(xml)
          open(res + '/values/tunes_colors.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="tunes_icon_bg">#0A0D12</color>\n</resources>\n')
          print('Icons written')
          PY

      - name: Stamp the build number
        run: |
          sed -i "s/__BUILD__/${{ github.run_number }}/" www/index.html
          grep -n "const APP_BUILD" www/index.html
          if grep -q "parseInt('__BUILD__'" www/index.html; then echo "Build number was NOT stamped"; exit 1; fi

      - name: Copy web files into the app
        run: npx cap sync android

      - name: Use the saved signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "The secret DEBUG_KEYSTORE_B64 is missing or empty. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore

      - name: Build the APK
        working-directory: my-tunes-app/android
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk My-Tunes-v${{ github.run_number }}.apk

      - name: Show signing fingerprint
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs My-Tunes-v${{ github.run_number }}.apk | grep "SHA-256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" My-Tunes-v${{ github.run_number }}.apk --title "My Tunes v${{ github.run_number }}" --notes "Build ${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: My-Tunes-APK
          path: my-tunes-app/My-Tunes-v${{ github.run_number }}.apk
