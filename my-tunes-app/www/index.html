<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0D12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Tunes</title>
<style>
  :root{
    --bg:#0A0D12; --panel:#141A22; --raise:#1E2631; --text:#EDF1F5; --mute:#8A97A8; --line:#263140;
    --accent:#3DD6B0; --on-accent:#101418; --r:10px;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button:focus:not(:focus-visible),[data-id]:focus{outline:none}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);overflow:hidden}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ic{display:block;flex:none}

  #app{height:100%;display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 84px;
       grid-template-areas:"side main" "bar bar";gap:8px;padding:8px}
  .panel{background:var(--panel);border-radius:calc(var(--r) + 4px);overflow:hidden}

  /* sidebar */
  #side{grid-area:side;display:flex;flex-direction:column;padding:18px 12px 12px;gap:10px;min-height:0}
  .brand{font-weight:800;font-size:20px;letter-spacing:-.01em;padding:0 8px 6px}
  .pill{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--raise);padding:9px 12px;border-radius:var(--r);text-align:left}
  .pill:hover{filter:brightness(1.15)}
  .pill.primary{background:var(--accent);color:var(--on-accent);font-weight:700}
  #nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:6px 0;min-height:0}
  #nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:6px 8px;border-radius:var(--r);text-align:left;width:100%}
  #nav button:hover{background:var(--raise)}
  #nav button.on{background:var(--raise);font-weight:700}
  #nav .nl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #nav small{color:var(--mute)}
  .navcover{width:36px;height:36px;flex:none;border-radius:calc(var(--r)/2 + 1px);display:grid;place-items:center;font-weight:700;color:#fff}
  .navcover.lib{background:var(--accent);color:var(--on-accent)}
  .foot{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
  .foot .pill{background:transparent;color:var(--mute)}
  .foot .pill:hover{background:var(--raise);color:var(--text);filter:none}

  /* main */
  #main{grid-area:main;overflow-y:auto;position:relative}
  #hero{display:flex;align-items:flex-end;gap:22px;padding:40px 28px 22px;background:var(--raise);
        background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 34%,var(--panel)),var(--panel))}
  .cover{container-type:inline-size;display:grid;place-items:center;font-weight:800;font-size:46cqw;line-height:1;color:rgba(255,255,255,.92)}
  #hero .cover{width:168px;height:168px;flex:none;border-radius:calc(var(--r) + 2px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #hero .cover.lib{color:var(--on-accent);background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 45%,var(--bg)))}
  #hero h1{margin:0;font-size:clamp(30px,5vw,60px);line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere}
  #hero p{margin:10px 0 0;color:var(--mute)}
  #toolbar{display:flex;align-items:center;gap:8px;padding:14px 28px}
  .iconbtn{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--mute);display:grid;place-items:center}
  .iconbtn:hover{color:var(--text)}
  .iconbtn.on{color:var(--accent)}
  .bigplay{width:54px;height:54px;border:0;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
  .bigplay:hover{transform:scale(1.05)}
  .spacer{flex:1}
  .search{position:relative;display:flex;align-items:center}
  .search .ic{position:absolute;left:11px;color:var(--mute);pointer-events:none}
  .search input{background:var(--raise);border:1px solid transparent;border-radius:999px;padding:8px 14px 8px 36px;width:220px}
  select{background:var(--raise);border:0;border-radius:var(--r);padding:8px 10px}

  .list{padding:0 16px 28px}
  .row{display:grid;grid-template-columns:40px minmax(0,1fr) 64px 36px;align-items:center;gap:12px;padding:6px 12px;border-radius:var(--r);cursor:pointer}
  .row.head{color:var(--mute);font-size:12px;border-bottom:1px solid var(--line);border-radius:0;cursor:default;margin-bottom:6px;padding-bottom:8px}
  .row:not(.head):hover{background:var(--raise)}
  .row .idx{display:grid;place-items:center;height:20px;color:var(--mute);font-variant-numeric:tabular-nums}
  .row .playico,.row .eq{display:none}
  .row:not(.head):hover .num{display:none}
  .row:not(.head):hover .playico{display:block;color:var(--text)}
  .row.playing .num,.row.playing .playico{display:none!important}
  .row.playing .eq{display:flex}
  .eq{gap:2px;align-items:flex-end;height:14px}
  .eq i{width:3px;height:100%;background:var(--accent);transform-origin:bottom;transform:scaleY(.4)}
  .is-playing .row.playing .eq i{animation:eq .9s ease-in-out infinite alternate}
  .eq i:nth-child(2){animation-delay:-.3s!important}.eq i:nth-child(3){animation-delay:-.6s!important}
  @keyframes eq{to{transform:scaleY(1)}}
  .tcell{display:flex;align-items:center;gap:12px;min-width:0}
  .thumb{width:40px;height:40px;flex:none;border-radius:calc(var(--r)/2 + 1px)}
  .tt{min-width:0}
  .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .a{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.playing .t,.card.playing .t{color:var(--accent)}
  .dur{color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
  .rowmenu{opacity:0;width:32px;height:32px}
  .row:hover .rowmenu,.rowmenu:focus-visible{opacity:1}
  [data-density=compact] .row{padding:2px 12px}
  [data-density=compact] .thumb{width:30px;height:30px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px;padding:0 16px 28px}
  .card{position:relative;padding:12px;border-radius:var(--r);cursor:pointer}
  .card:hover{background:var(--raise)}
  .card .cover{width:100%;aspect-ratio:1;border-radius:calc(var(--r));box-shadow:0 8px 20px rgba(0,0,0,.35)}
  .card .tt{margin-top:10px}
  .card .rowmenu{position:absolute;top:18px;right:18px;background:rgba(0,0,0,.6);color:#fff}
  .card:hover .rowmenu{opacity:1}

  .empty{margin:30px 28px;padding:48px 20px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:calc(var(--r) + 4px);display:flex;flex-direction:column;align-items:center;gap:14px}
  .empty .pill{width:auto;background:var(--accent);color:var(--on-accent);font-weight:700}
  body.drag #main{outline:2px dashed var(--accent);outline-offset:-10px}

  /* player bar */
  #bar{grid-area:bar;display:grid;grid-template-columns:1fr minmax(320px,640px) 1fr;align-items:center;gap:16px;padding:0 16px;
       background:var(--panel);border-radius:calc(var(--r) + 4px)}
  .now{display:flex;align-items:center;gap:12px;min-width:0}
  .now .cover{width:56px;height:56px;flex:none;border-radius:calc(var(--r)/2 + 2px);background:var(--raise);color:var(--mute)}
  .ctl{display:flex;flex-direction:column;gap:6px}
  .btns{display:flex;justify-content:center;align-items:center;gap:10px}
  #play{width:40px;height:40px;border:0;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
  #play:hover{transform:scale(1.06)}
  .seek{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
  .seek span{width:38px}.seek span:first-child{text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;margin:0;flex:1;cursor:pointer;
    background:linear-gradient(to right,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);opacity:0}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--text);opacity:0}
  input[type=range]::-moz-range-track{background:transparent}
  input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
  input[type=range]:hover::-moz-range-thumb,input[type=range]:focus-visible::-moz-range-thumb{opacity:1}
  .vol{display:flex;align-items:center;justify-content:flex-end;gap:8px;color:var(--mute)}
  .vol input{max-width:120px}

  /* menu, toast, settings */
  #menu{position:fixed;z-index:50;min-width:210px;max-width:300px;max-height:60vh;overflow-y:auto;background:var(--raise);border:1px solid var(--line);
        border-radius:var(--r);padding:5px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
  #menu[hidden]{display:none}
  #menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:calc(var(--r)/2 + 1px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menu button:hover{background:var(--line)}
  #menu button.danger{color:#FF7B7B}
  #menu hr{border:0;border-top:1px solid var(--line);margin:5px 2px}
  #toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
  #toast.show{opacity:1}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:calc(var(--r) + 6px);padding:0;width:min(480px,92vw)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .dlg{padding:24px}
  .dlg h3{margin:0 0 4px;font-size:20px}
  .dlg h4{margin:20px 0 8px;font-size:13px;color:var(--mute);font-weight:600}
  .presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .preset{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--raise);border-radius:var(--r);padding:8px}
  .preset.on{outline:2px solid var(--accent)}
  .sw{width:40px;height:28px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center}
  .sw i{width:10px;height:10px;border-radius:50%}
  .field{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:12px 0}
  .field input[type=range]{max-width:200px}
  .field input[type=color]{width:44px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
  .linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:4px}
  .done{margin-top:18px;float:right;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;padding:9px 20px;border-radius:999px}
  @media (prefers-reduced-motion:reduce){.is-playing .row.playing .eq i{animation:none}.bigplay:hover,#play:hover{transform:none}}
  /* cursor fix */
  button,.pill,.iconbtn,select,input[type=range],input[type=color]{cursor:pointer}
  button,.pill,.iconbtn,#side,#bar{user-select:none;-webkit-user-select:none}
  button *{pointer-events:none}
  /* cover letter size fix */
  .cover{container-type:normal;font-size:20px}
  .thumb{font-size:18px}
  [data-density=compact] .thumb{font-size:14px}
  .card .cover{font-size:56px}
  #hero .cover{font-size:72px}
  .now .cover{font-size:24px}

  /* ===== general fixes ===== */
  [hidden]{display:none!important}
  @media (pointer:coarse){#addFolderBtn{display:none}}

  /* ===== phone layout ===== */
  @media (max-width:820px){
    html,body{height:100dvh}
    #app{height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"side" "main" "bar";gap:6px;
         padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
    #side{flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px;gap:8px}
    .brand{flex:1;padding:0;font-size:18px}
    #side .pill{width:auto;padding:10px;border-radius:50%}
    .lbl{display:none}
    .foot{display:contents}
    .foot .pill{background:var(--raise);color:var(--text)}
    #nav{order:9;flex:none;width:100%;flex-direction:row;overflow-x:auto;margin:0;gap:6px;padding-bottom:2px}
    #nav button{width:auto;flex:none;white-space:nowrap;background:var(--raise);border-radius:999px;padding:7px 14px}
    #nav button.on{background:var(--accent);color:var(--on-accent)}
    #nav .navcover{display:none}
    #nav small{color:inherit;opacity:.7}

    #hero{padding:18px 16px 14px;gap:14px}
    #hero .cover{width:92px;height:92px;font-size:44px}
    #hero .cover.lib svg{width:44px;height:44px}
    #hero h1{font-size:28px}
    #toolbar{flex-wrap:wrap;padding:10px 16px;gap:6px}
    #toolbar .iconbtn{width:40px;height:40px}
    .bigplay{width:50px;height:50px}
    .search{order:9;flex:1 1 100%}
    .search input{width:100%}

    .list{padding:0 6px 20px}
    .row{grid-template-columns:28px minmax(0,1fr) 44px 40px;gap:8px;padding:6px 8px}
    .rowmenu{opacity:1;width:40px;height:40px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));padding:0 8px 20px}
    .card{padding:8px}
    .card .cover{font-size:44px}
    .card .rowmenu{top:12px;right:12px;width:36px;height:36px}
    .empty{margin:16px}

    #bar{grid-template-columns:minmax(0,1fr);gap:6px;padding:10px 12px}
    .vol{display:none}
    .ctl{gap:2px}
    .btns{gap:6px}
    .btns .iconbtn{width:44px;height:44px}
    #play{width:48px;height:48px}
    #toast{bottom:170px}
  }
  .note{margin:0 28px 10px;color:var(--mute);font-size:13px}
  @media (max-width:820px){.note{margin:0 16px 10px}}

  /* ===== favorites, selecting songs, real covers ===== */
  .row{grid-template-columns:40px minmax(0,1fr) 36px 56px 36px}
  .row .heart{width:32px;height:32px;opacity:.55}
  .row .heart.on,.row:hover .heart{opacity:1}
  .heart.on{color:var(--accent)}
  .card .heart{position:absolute;top:18px;left:18px;width:32px;height:32px;background:rgba(0,0,0,.6);color:#fff}
  .card .heart.on{color:var(--accent)}
  .row,.card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--mute);display:grid;place-items:center;color:var(--on-accent);flex:none}
  .chk svg{opacity:0}
  .sel .chk{background:var(--accent);border-color:var(--accent)}
  .sel .chk svg{opacity:1}
  .card .chk{position:absolute;top:18px;left:18px;background:rgba(0,0,0,.55);border-color:#fff}
  .card.sel .chk{background:var(--accent);border-color:var(--accent)}
  .row.sel{background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
  .card.sel{outline:2px solid var(--accent);outline-offset:-2px}
  #content.selecting .rowmenu{visibility:hidden}
  #selbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0 16px 10px;padding:8px 12px;background:var(--raise);border-radius:var(--r);box-shadow:0 4px 14px rgba(0,0,0,.3)}
  #selCount{font-weight:700;margin-right:auto}
  .chip{border:0;background:var(--panel);border-radius:999px;padding:7px 14px}
  .chip:disabled{opacity:.4}
  .chip.danger{color:#FF7B7B}
  .chip.accent{background:var(--accent);color:var(--on-accent);font-weight:700}
  .now .tt{flex:1;min-width:0}
  @media (max-width:820px){
    .row{grid-template-columns:26px minmax(0,1fr) 34px 40px 36px;gap:6px}
    .rowmenu{width:36px;height:36px}
    .card .heart,.card .chk{top:12px;left:12px}
    #selbar{margin:0 8px 10px}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side" class="panel">
    <div class="brand">My Tunes</div>
    <button class="pill primary" id="addBtn" data-ic="plus" title="Add songs"><span class="lbl">Add songs</span></button>
    <button class="pill" id="addFolderBtn" data-ic="folder" title="Add folder"><span class="lbl">Add folder</span></button>
    <nav id="nav" aria-label="Library and playlists"></nav>
    <div class="foot">
      <button class="pill" id="newPl" data-ic="plus" title="New playlist"><span class="lbl">New playlist</span></button>
      <button class="pill" id="openSettings" data-ic="gear" title="Customize"><span class="lbl">Customize</span></button>
    </div>
  </aside>

  <main id="main" class="panel">
    <section id="hero"></section>
    <div id="toolbar">
      <button class="bigplay" id="bigplay" aria-label="Play"></button>
      <button class="iconbtn" id="shuffle2" data-ic="shuffle" aria-label="Shuffle"></button>
      <button class="iconbtn" id="plMore" data-ic="more" data-menu aria-label="Playlist options" hidden></button>
      <button class="iconbtn" id="selectBtn" data-ic="checksq" aria-label="Select songs"></button>
      <span class="spacer"></span>
      <label class="search"><span data-ic="search" data-s="16"></span><input id="search" type="search" placeholder="Search your songs" aria-label="Search songs"></label>
      <select id="sort" aria-label="Sort songs">
        <option value="added">Recently added</option>
        <option value="title">Title</option>
        <option value="artist">Artist</option>
      </select>
      <button class="iconbtn" id="viewList" data-ic="list" aria-label="List view"></button>
      <button class="iconbtn" id="viewGrid" data-ic="grid" aria-label="Grid view"></button>
    </div>
    <div id="selbar" hidden>
      <span id="selCount">0 selected</span>
      <button class="chip" id="selAll">All</button>
      <button class="chip" id="selAdd" data-menu>Add to playlist</button>
      <button class="chip" id="selFav">Favorite</button>
      <button class="chip danger" id="selDel">Delete</button>
      <button class="chip accent" id="selDone">Done</button>
    </div>
    <div id="content"></div>
  </main>

  <footer id="bar">
    <div class="now">
      <div class="cover" id="npCover"></div>
      <div class="tt"><div class="t" id="npTitle">Nothing playing</div><div class="a" id="npArtist">Pick a song to start</div></div>
      <button class="iconbtn" id="npFav" aria-label="Favorite" hidden></button>
    </div>
    <div class="ctl">
      <div class="btns">
        <button class="iconbtn" id="shuffle" aria-label="Shuffle"></button>
        <button class="iconbtn" id="prev" aria-label="Previous"></button>
        <button id="play" aria-label="Play"></button>
        <button class="iconbtn" id="next" aria-label="Next"></button>
        <button class="iconbtn" id="repeat" aria-label="Repeat"></button>
      </div>
      <div class="seek">
        <span id="cur">0:00</span>
        <input id="seek" type="range" min="0" max="0" value="0" step="0.1" aria-label="Seek">
        <span id="dur">0:00</span>
      </div>
    </div>
    <div class="vol"><span data-ic="vol"></span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"></div>
  </footer>
</div>

<dialog id="settings"><div class="dlg">
  <h3>Customize</h3>
  <h4>Theme</h4>
  <div class="presets" id="presets"></div>
  <h4>Details</h4>
  <div class="field"><label for="accent">Accent colour</label><span><button class="linkbtn" id="accentReset">Use theme colour</button> <input type="color" id="accent"></span></div>
  <div class="field"><label for="radius">Roundness</label><input type="range" id="radius" min="0" max="24" step="1"></div>
  <div class="field"><label for="density">Row size</label><select id="density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></div>
  <div class="field"><label for="font">Font</label><select id="font"><option value="sans">Sans</option><option value="serif">Serif</option><option value="mono">Mono</option></select></div>
  <h4>App</h4>
  <div class="field"><span>Song titles and covers</span><button class="linkbtn" id="rescanBtn">Re-read from files</button></div>
  <div class="field"><span id="verText">Version</span><button class="linkbtn" id="updateBtn">Check for updates</button></div>
  <div class="field" id="installRow" hidden><span>Install on this device</span><button class="linkbtn" id="installBtn">Install app</button></div>
  <button class="done" id="closeSettings">Done</button>
  <div style="clear:both"></div>
</div></dialog>

<div id="menu" hidden></div>
<div id="toast" role="status"></div>
<input type="file" id="files" accept="audio/*,.mp3,.m4a,.flac,.ogg,.opus,.wav,.aac" multiple hidden>
<input type="file" id="folder" webkitdirectory hidden>
<audio id="audio" preload="auto"></audio>

<script>
// ================= icons =================
const S = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const I = {

// Shrinks the cover to a small JPEG so lists stay fast

    const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));

    c.getContext('2d').drawImage(bmp, 0, 0, w, h);

  const files = [...fileList].filter(f => f.type.startsWith('audio/') || AUDIO_EXT.test(f.name));
  if (!files.length) { toast('No audio files found'); return; }
  toast('Adding ' + files.length + (files.length === 1 ? ' song…' : ' songs…'));
  for (let i = 0; i < files.length; i++) {
    const f = files[i], info = nameInfo(f), tags = await readTags(f);
    const cover = tags.picture ? await makeCover(tags.picture) : null;
    const song = {id: uid(), title: tags.title || info.title, artist: tags.artist || info.artist, album: tags.album || '',
      blob: f, added: Date.now(), duration: await getDuration(f), cover, tagged: true, fav: false, favAt: 0, lastPlayed: 0};
    await tx('songs', 'readwrite', s => s.put({id: song.id, title: song.title, artist: song.artist, added: song.added, blob: f}));
    await saveMeta(song);

    if (tags.artist) s.artist = tags.artist;
    if (tags.album) s.album = tags.album;
    if (tags.picture) { const c = await makeCover(tags.picture); if (c) s.cover = c; }
    if (!s.duration) s.duration = await getDuration(s.blob);
    s.tagged = true;
    await saveMeta(s);
  }
  render();
  if (todo.length > 3) toast('Song info updated');
}

// ================= playback =================
function playList(list, idx) { queue = list.map(s => s.id); qi = idx; load(); }
function setNow(s) {
  const c = $('npCover');
  if (s) { c.style.cssText = coverStyle(s); c.innerHTML = coverInner(s); }
  else { c.style.cssText = ''; c.innerHTML = ic('note', 24); }
  $('npTitle').textContent = s ? s.title : 'Nothing playing';
  $('npArtist').textContent = s ? s.artist : 'Pick a song to start';
}
function load() {
  const s = songById(queue[qi]);
  if (!s) return;
  if (currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = URL.createObjectURL(s.blob);
  audio.src = currentUrl;
  audio.play().catch(() => {});
  s.lastPlayed = Date.now();
  saveMeta(s).catch(() => {});
  setNow(s);
  document.title = s.title + ' · My Tunes';
  if ('mediaSession' in navigator) {
    const art = coverUrl(s);
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.title, artist: s.artist, album: s.album || '',
      artwork: art ? [{src: art, sizes: '512x512', type: 'image/jpeg'}] : []
    });
  }
  render();
}
function next(auto) {
  if (!queue.length) return;
  if (auto && repeat === 'one') { audio.currentTime = 0; audio.play(); return; }
  if (shuffle && queue.length > 1) {
    let n; do { n = Math.floor(Math.random() * queue.length); } while (n === qi);
    qi = n;
  } else if (qi + 1 < queue.length) qi++;
  else if (repeat === 'all') qi = 0;
  else { audio.pause(); return; }
  load();
}
function prev() {
  if (!queue.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  qi = qi > 0 ? qi - 1 : queue.length - 1;
  load();
}
function toggle() { if (qi < 0) return; audio.paused ? audio.play() : audio.pause(); }

audio.addEventListener('ended', () => next(true));
audio.addEventListener('play', syncButtons);
audio.addEventListener('pause', syncButtons);
audio.addEventListener('loadedmetadata', () => { $('seek').max = audio.duration; $('dur').textContent = fmt(audio.duration); setP($('seek')); });
audio.addEventListener('timeupdate', () => {
  $('cur').textContent = fmt(audio.currentTime);
  if (!dragging) { $('seek').value = audio.currentTime; setP($('seek')); }
});
$('seek').addEventListener('pointerdown', () => dragging = true);
$('seek').addEventListener('change', e => { dragging = false; e.target.blur(); });
$('seek').addEventListener('input', e => { audio.currentTime = e.target.value; $('cur').textContent = fmt(+e.target.value); setP(e.target); });
$('volume').addEventListener('input', e => { audio.volume = e.target.value; setP(e.target); settings.vol = +e.target.value; saveSettings(); });
$('volume').addEventListener('change', e => e.target.blur());

function syncButtons() {
  const playing = !audio.paused && qi >= 0;
  document.body.classList.toggle('is-playing', playing);
  $('play').innerHTML = ic(playing ? 'pause' : 'play', 22);
  $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  $('prev').innerHTML = ic('prev', 22);
  $('next').innerHTML = ic('next', 22);
  $('shuffle').innerHTML = ic('shuffle', 18);
  $('repeat').innerHTML = ic(repeat === 'one' ? 'repeat1' : 'repeat', 18);
  $('shuffle').classList.toggle('on', shuffle);
  $('shuffle2').classList.toggle('on', shuffle);
  $('repeat').classList.toggle('on', repeat !== 'off');
  $('repeat').setAttribute('aria-label', 'Repeat: ' + repeat);
  const cur = queue[qi], inList = cur && visible().some(s => s.id === cur);
  $('bigplay').innerHTML = ic(playing && inList ? 'pause' : 'play', 26);
  const cs = songById(queue[qi]);

}
$('play').onclick = toggle;
$('next').onclick = () => next(false);
$('prev').onclick = prev;
const toggleShuffle = () => { shuffle = !shuffle; syncButtons(); };
$('shuffle').onclick = toggleShuffle;
$('shuffle2').onclick = toggleShuffle;
$('repeat').onclick = () => { repeat = {off: 'all', all: 'one', one: 'off'}[repeat]; syncButtons(); };
$('bigplay').onclick = () => {

  else if (inList) audio.play();
  else playList(list, shuffle ? Math.floor(Math.random() * list.length) : 0);
};

document.addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(e.target.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight' && e.shiftKey) next(false);
  if (e.code === 'ArrowLeft' && e.shiftKey) prev();
});
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', toggle);
  navigator.mediaSession.setActionHandler('pause', toggle);
  navigator.mediaSession.setActionHandler('nexttrack', () => next(false));
  navigator.mediaSession.setActionHandler('previoustrack', prev);
}

// ================= playlists & deleting =================
const savePl = p => tx('playlists', 'readwrite', s => s.put(p));
async function newPlaylist(ids = [], go = true) {
  const name = prompt('Name your playlist');
  if (!name || !name.trim()) return;
  const p = {id: uid(), name: name.trim(), songIds: [...ids]};
  playlists.push(p); await savePl(p);
  if (go) view = p.id;
  render(); toast('Created “' + p.name + '”');
}
async function addToPlaylist(p, id) {
  if (!p.songIds.includes(id)) { p.songIds.push(id); await savePl(p); render(); }
  toast('Added to “' + p.name + '”');
}
async function removeSongs(ids) {
  const set = new Set(ids);
  songs = songs.filter(s => !set.has(s.id));
  for (const id of ids) {
    await tx('songs', 'readwrite', st => st.delete(id));
    await tx('meta', 'readwrite', st => st.delete(id));
    const u = coverUrls.get(id); if (u) { URL.revokeObjectURL(u.url); coverUrls.delete(id); }
  }
  for (const p of playlists) {
    const n = p.songIds.length;
    p.songIds = p.songIds.filter(x => !set.has(x));
    if (p.songIds.length !== n) await savePl(p);
  }
  render();
}
async function deleteSong(id) {
  const s = songById(id);
  if (!s || !confirm('Delete “' + s.title + '” from your library?')) return;
  await removeSongs([id]);
}

const norm = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const searchTerms = () => norm($('search').value).split(/\s+/).filter(Boolean);
function sortedLibrary() {
  const k = settings.sort;
  return [...songs].sort((a, b) => k === 'title' ? a.title.localeCompare(b.title)
    : k === 'artist' ? (a.artist + a.title).localeCompare(b.artist + b.title) : b.added - a.added);
}
function baseList() {
  if (view === 'library') return sortedLibrary();
  if (view === 'favorites') return songs.filter(s => s.fav).sort((a, b) => b.favAt - a.favAt);
  if (view === 'recent') return songs.filter(s => s.lastPlayed).sort((a, b) => b.lastPlayed - a.lastPlayed).slice(0, 100);
  return plById(view)?.songIds.map(songById).filter(Boolean) || [];
}
function visible() {
  const terms = searchTerms();
  const list = (terms.length && plById(view)) ? sortedLibrary() : baseList();   // searching inside a playlist looks through the whole library
  return terms.length ? list.filter(s => { const h = norm(s.title + ' ' + s.artist + ' ' + (s.album || '')); return terms.every(t => h.includes(t)); }) : list;
}
function totalText(list) {
  const sec = list.reduce((n, s) => n + (s.duration || 0), 0);
  if (!sec) return '';
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return ' · ' + (h ? h + ' hr ' : '') + m + ' min';
}

// The build number is stamped in by the GitHub build ("__BUILD__" becomes the real number).
const APP_BUILD = parseInt('__BUILD__', 10) || 0;
const REPO = 'andrei-bytEE/my-tunes';
const APK_URL = `https://github.com/${REPO}/releases/latest/download/My-Tunes.apk`;
function openExternal(url) {
  const B = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser;
  if (B && B.open) B.open({url}); else window.open(url, '_blank');
}
async function checkUpdate() {
  const btn = $('updateBtn');
  btn.disabled = true; btn.textContent = 'Checking…';
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`, {headers: {Accept: 'application/vnd.github+json'}, cache: 'no-store'});
    if (!r.ok) throw new Error('status ' + r.status);
    const rel = await r.json();
    const latest = parseInt(String(rel.tag_name).replace(/\D/g, ''), 10) || 0;
    if (latest > APP_BUILD) {
      const apks = (rel.assets || []).filter(a => /\.apk$/i.test(a.name));
      const apk = apks.find(a => /-v\d+\.apk$/i.test(a.name)) || apks[0];
      const url = apk ? apk.browser_download_url : APK_URL;
      if (confirm(`Version ${latest} is available (you have ${APP_BUILD || 'a test build'}).\n\nDownload it now? When it finishes, open the downloaded file to install. Your songs and playlists are kept.`)) openExternal(url);
    } else toast("You're on the latest version");
  } catch (e) {
    toast("Couldn't check for updates. Are you online?");
  }
  btn.disabled = false; btn.textContent = 'Check for updates';
}
$('updateBtn').onclick = checkUpdate;

  applyTheme();
  try { navigator.storage?.persist?.(); } catch {}
  audio.volume = settings.vol; $('volume').value = settings.vol; setP($('volume'));
  setNow(null);
  const recs = await tx('songs', 'readonly', s => s.getAll()) || [];
  const metas = await tx('meta', 'readonly', s => s.getAll()) || [];
  const mm = new Map(metas.map(m => [m.id, m]));
  songs = recs.map(r => Object.assign({}, r, mm.get(r.id) || {}));
  playlists = await tx('playlists', 'readonly', s => s.getAll()) || [];
  render();
  backfillInfo();
})();
</script>
</body>
